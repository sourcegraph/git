name: Sourcegraph CI

on:
  push:
    branches: [sourcegraph]
  pull_request:
    branches: [sourcegraph]

permissions:
  contents: read

concurrency:
  group: sourcegraph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER: 1

jobs:
  linux:
    name: Linux AMD64 build and test
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CI_JOB_IMAGE: ubuntu-24.04
      jobname: linux-sourcegraph
      TEST_OUTPUT_DIRECTORY: ${{ github.workspace }}/t
    steps:
      - uses: actions/checkout@v6
      - run: test "$(uname -m)" = x86_64
      - name: Configure branded version
        run: |
          . contrib/sourcegraph/packaging/release.sh
          echo "GIT_VERSION=$GIT_VERSION" >>"$GITHUB_ENV"
      - run: ci/install-dependencies.sh
        env:
          CUSTOM_PATH: ${{ runner.temp }}/custom
      - run: ci/run-build-and-tests.sh
      - run: test "$(./git --version)" = "git version $GIT_VERSION"
      - if: failure() && env.FAILED_TEST_ARTIFACTS != ''
        run: ci/print-test-failures.sh

  darwin:
    name: Darwin ARM64 build and test
    runs-on: macos-15
    env:
      CC: clang
      CI_JOB_IMAGE: macos-15
      jobname: osx-clang
      TEST_OUTPUT_DIRECTORY: ${{ github.workspace }}/t
    steps:
      - uses: actions/checkout@v6
      - run: test "$(uname -m)" = arm64
      - run: test "$(sw_vers -productVersion | cut -d. -f1)" = 15
      - name: Configure branded version
        run: |
          . contrib/sourcegraph/packaging/release.sh
          echo "GIT_VERSION=$GIT_VERSION" >>"$GITHUB_ENV"
      - run: ci/install-dependencies.sh
        env:
          CUSTOM_PATH: ${{ runner.temp }}/custom
      - run: ci/run-build-and-tests.sh
      - run: test "$(./git --version)" = "git version $GIT_VERSION"
      - if: failure() && env.FAILED_TEST_ARTIFACTS != ''
        run: ci/print-test-failures.sh

  darwin-archive:
    name: Darwin ARM64 archive
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: test "$(uname -m)" = arm64
      - run: test "$(sw_vers -productVersion | cut -d. -f1)" = 15
      - name: Install build dependencies
        run: |
          brew install gnu-tar
          command -v rustc
          command -v cargo
          command -v gtar
      - name: Build archive from exact recipe head
        run: ./contrib/sourcegraph/packaging/build-darwin.sh artifacts
      - name: Validate archive
        run: |
          ./contrib/sourcegraph/packaging/validate-darwin-archive.sh \
            artifacts/git-sourcegraph-v2.55.0-3-darwin-arm64.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: git-sourcegraph-v2.55.0-3-darwin-arm64
          path: |
            artifacts/git-sourcegraph-v2.55.0-3-darwin-arm64.tar.gz
            artifacts/git-sourcegraph-v2.55.0-3-darwin-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  fork-policy:
    name: Fork and packaging policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify linear history and whitespace
        run: |
          test "$(git rev-parse v2.55.0^{commit})" = e9019fcafe0040228b8631c30f97ae1adb61bcdc
          test -z "$(git rev-list --merges v2.55.0..HEAD)"
          git log --check v2.55.0..HEAD
      - name: Verify packaging scripts and release identity
        run: |
          test ! -d contrib/sourcegraph/packaging || {
            for script in contrib/sourcegraph/packaging/*.sh
            do
              sh -n "$script"
            done
            . contrib/sourcegraph/packaging/release.sh
            test "$SOURCE_TAG" = v2.55.0
            test "$SOURCE_COMMIT" = e9019fcafe0040228b8631c30f97ae1adb61bcdc
            test "$RELEASE_VERSION" = v2.55.0-3
            test "$GIT_VERSION" = 2.55.0.sourcegraph.3
            grep -F 'FROM debian:12@sha256:' contrib/sourcegraph/packaging/Dockerfile.linux
          }
